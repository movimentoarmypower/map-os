<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parceria de produtos | Movimento Army Power</title>
<style>
:root{--roxo-escuro:#401443;--roxo:#702477;--magenta:#a12ba4;--fundo:#f7f5f8;--texto:#26152e;--suave:#776b7d;--borda:#e9e0ec;--verde:#17806a;--vermelho:#b42318;--azul:#36c3c7}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--texto);background:var(--fundo);line-height:1.45}
header{background:var(--roxo-escuro);color:#fff;padding:28px 16px}
header .in,main{max-width:760px;margin:0 auto}
.marca{display:flex;align-items:center;gap:12px}
.ic{width:44px;height:44px;border-radius:12px;background:var(--azul);display:grid;place-items:center;font-weight:bold}
header h1{margin:16px 0 6px;font-size:26px}
header p{margin:0;opacity:.9}
main{padding:22px 16px 48px}
.card{background:#fff;border:1px solid var(--borda);border-radius:16px;padding:20px;margin-bottom:16px}
h2{font-size:18px;color:var(--roxo-escuro);margin:0 0 10px}
label{display:block;font-weight:bold;font-size:14px;margin:14px 0 5px}
small.d{display:block;color:var(--suave);font-weight:normal;font-size:13px;margin-top:2px}
input[type=text],input[type=email],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--borda);border-radius:10px;font:inherit;background:#fff}
textarea{min-height:110px;resize:vertical}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
@media(max-width:620px){.duas{grid-template-columns:1fr}}
.ac{display:flex;gap:10px;align-items:flex-start;font-weight:normal;margin-top:18px}
.ac input{margin-top:4px}
button{background:var(--magenta);color:#fff;border:0;border-radius:10px;padding:12px 22px;font:inherit;font-weight:bold;cursor:pointer;margin-top:18px}
button:disabled{opacity:.6;cursor:wait}
.msg{padding:12px 14px;border-radius:10px;margin-top:14px;display:none}
.msg.erro{display:block;background:#fdecea;color:var(--vermelho)}
.msg.ok{display:block;background:#e3f4ef;color:var(--verde)}
.oculto{position:absolute;left:-9999px}
footer{text-align:center;color:var(--suave);font-size:13px;padding:0 16px 30px}
</style>
</head>
<body>
<header><div class="in">
  <div class="marca"><div class="ic">MAP</div><b>Movimento Army Power</b></div>
  <h1>Tem uma ideia de produto em parceria com o MAP?</h1>
  <p>Conte para a nossa equipe de Comercial &amp; Produtos. Vamos ler com atenção e responder por e-mail.</p>
</div></header>
<main>
<form id="f" class="card" novalidate>
  <h2>Sobre você</h2>
  <div class="duas">
    <div><label for="nome">Seu nome *</label><input type="text" id="nome" maxlength="120" autocomplete="name"></div>
    <div><label for="email">Seu e-mail *</label><input type="email" id="email" maxlength="150" autocomplete="email"></div>
    <div><label for="whats">WhatsApp (opcional)</label><input type="text" id="whats" maxlength="40" autocomplete="tel"></div>
    <div><label for="empresa">Empresa, marca ou projeto (opcional)</label><input type="text" id="empresa" maxlength="150"></div>
  </div>
  <label for="local">Cidade e país</label><input type="text" id="local" maxlength="120">

  <h2 style="margin-top:24px">Sobre a ideia</h2>
  <label for="tipo">Que tipo de parceria você propõe? *</label>
  <select id="tipo">
    <option value="">Escolha...</option>
    <option>Criar um produto em conjunto com o MAP</option>
    <option>Licenciar a marca ou um projeto do MAP</option>
    <option>Produzir ou fornecer produtos MAP</option>
    <option>Outra parceria de produto</option>
  </select>
  <label for="ideia">Nome da ideia ou do produto *</label><input type="text" id="ideia" maxlength="150">
  <label for="descricao">Conte a ideia *<small class="d">O que é o produto, como funciona e por que combina com o MAP.</small></label><textarea id="descricao" maxlength="4000"></textarea>
  <label for="publico">Para quem é o produto?<small class="d">Quem compraria ou usaria.</small></label><textarea id="publico" maxlength="600" style="min-height:70px"></textarea>
  <label for="diferencial">O que torna essa ideia diferente?</label><textarea id="diferencial" maxlength="1000" style="min-height:70px"></textarea>
  <label for="papel">O que você espera do MAP nessa parceria?<small class="d">Por exemplo: uso da marca, divulgação, distribuição, criação conjunta.</small></label><textarea id="papel" maxlength="1000" style="min-height:70px"></textarea>
  <div class="duas">
    <div><label for="prototipo">Em que fase está a ideia?</label>
      <select id="prototipo"><option value="">Escolha...</option><option>Só a ideia</option><option>Tenho desenhos ou esboços</option><option>Tenho um protótipo</option><option>O produto já existe e é vendido</option></select></div>
    <div><label for="links">Links (opcional)<small class="d">Fotos, apresentação, site ou redes.</small></label><input type="text" id="links" maxlength="600"></div>
  </div>
  <label for="proposta">Como imagina a divisão de custos e resultados? (opcional)</label><textarea id="proposta" maxlength="600" style="min-height:70px"></textarea>

  <input type="text" id="site" class="oculto" tabindex="-1" autocomplete="off" aria-hidden="true">
  <label class="ac"><input type="checkbox" id="aceite"> <span>Li e concordo que o MAP use os dados deste formulário só para avaliar a proposta e entrar em contato comigo.</span></label>
  <button type="submit" id="bt">Enviar a ideia</button>
  <div id="msg" class="msg" role="status"></div>
</form>
</main>
<footer>Movimento Army Power · Brasil, Portugal e Angola</footer>
<script>
(function(){
  var API = "https://script.google.com/macros/s/AKfycbz726zGhy4aDOOMWJHMOYh6h6QKpm6svEQFk9RxIBrjuYhoY9C9MvgqZopIOnhF3nWu/exec";
  var $ = function(id){ return document.getElementById(id); };
  function aviso(t, ok){ var m = $('msg'); m.className = 'msg ' + (ok ? 'ok' : 'erro'); m.textContent = t; m.scrollIntoView({behavior:'smooth', block:'center'}); }
  $('f').addEventListener('submit', function(ev){
    ev.preventDefault();
    var d = {};
    ['nome','email','whats','empresa','local','tipo','ideia','descricao','publico','diferencial','papel','prototipo','links','proposta','site'].forEach(function(k){ d[k] = $(k).value.trim(); });
    d.aceite = $('aceite').checked;
    if (d.nome.length < 3) return aviso('Escreva o seu nome.');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email)) return aviso('Confira o seu e-mail.');
    if (!d.tipo) return aviso('Escolha o tipo de parceria.');
    if (d.ideia.length < 5) return aviso('Dê um nome para a sua ideia de produto.');
    if (d.descricao.length < 40) return aviso('Conte a sua ideia com mais detalhes (pelo menos 40 letras).');
    if (!d.aceite) return aviso('Para enviar, confirme que leu e concorda com o uso dos dados.');
    $('bt').disabled = true; $('bt').textContent = 'Enviando...';
    fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({fn:'pdIdeiaEnviar', args:[d]}), redirect:'follow'})
      .then(function(r){ return r.json(); })
      .then(function(j){
        var r = j && j.r;
        if (j && j.__erro !== undefined) throw new Error(j.__erro);
        if (!r || !r.ok) throw new Error(r && r.erro || 'Não foi possível enviar agora.');
        $('f').reset();
        aviso('Recebemos a sua ideia! Número: ' + r.id + '. A equipe de Comercial & Produtos vai responder pelo e-mail informado.', true);
      })
      .catch(function(e){ aviso(e && e.message && !/fetch|network/i.test(e.message) ? e.message : 'Sem conexão no momento. Confira a internet e tente de novo.'); })
      .then(function(){ $('bt').disabled = false; $('bt').textContent = 'Enviar a ideia'; });
  });
})();
</script>
</body>
</html>
